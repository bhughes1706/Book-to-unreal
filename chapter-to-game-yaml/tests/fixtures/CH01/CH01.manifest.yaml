scenes:
- id: CH01_S01_DIKE_BEACH
  order: 1
  title: Painted Waves
  location_id: LOC_OSAKA_DIKE_BEACH
  time_context: Night
  character_ids:
  - CHAR_GRAYSON_OCHS
  - CHAR_MYSTERIOUS_BOY
  world_system_ids:
  - SYS_LEADERS
  source_span:
    start_anchor: The waves aren’t real.
    end_anchor: Want to walk up there?
  canonical:
    events:
    - Grayson contemplates the deteriorating painted waves and the unseen real ocean.
    - He remembers childhood stargazing and reflects on climate-damaged Osaka.
    - Noah sits beside him.
    - An unidentified boy appears and traces the painted waves with his hand.
    narrative_function:
    - Establish Grayson’s internal voice.
    - Introduce artificial nature, decay, and isolation.
    - Present the boy as an unexplained disturbance.
    entry_state: Grayson is lying on or near the damp sand with Noah beside him.
    exit_state: Grayson and Noah decide to climb the dike.
  adaptation:
    player_role: Controllable Grayson in a quiet environmental opening.
    player_goal: Absorb the scene and discover that the visible waves are only paint.
    camera: Locked side-view or very low-FOV side camera; wall occupies roughly 80–85% of vertical frame.
    gameplay_mode:
    - walk
    - observe
    - inspect
    beats:
    - id: BEAT_OPENING_STILLNESS
      trigger: BeginPlay
      action: Delay narration and enable movement after a brief ambient hold.
      player_experience: The player feels alone and unhurried.
      optional: false
    - id: BEAT_INSPECT_PAINTED_WAVES
      trigger: Player inspects the wall or walks near it.
      action: Present a short internal observation about the painted waves.
      player_experience: The core artificial-versus-real contradiction becomes clear.
      optional: false
    - id: BEAT_BOY_RUNS_ACROSS
      trigger: After inspection or a maximum quiet interval.
      action: Spawn the boy offscreen and run him along the wall with one hand tracing it.
      player_experience: A sudden unexplained event interrupts stillness.
      optional: false
    interactions:
    - painted wave section
    - gray damp sand
    - optional look toward top of wall
    audio_direction:
    - Real waves crash unseen beyond the wall.
    - Low wind and distant city hum.
    - No music at first.
    visual_direction:
    - Gray lifeless sand with minimal debris.
    - Massive worn concrete with faded amateur wave paint.
    - Only a narrow strip of threatening gray cloud above the wall.
    - Subtle mist at wall base.
    transition_out: After the boy disappears, Grayson continues alone toward the stairs and dike-top walkway.
    changes_from_source:
    - type: character_entry_order
      canonical: Noah is present on the beach before the boy appears and climbs the dike with Grayson.
      proposed: Noah is absent from the beach and dike sequences. Grayson begins alone, witnesses the boy alone,
        and continues toward the reading alone.
      rationale: Preserve the opening's isolation and delay companionship until Grayson reaches the public reading
        environment.
      approval: approved_by_author
    - type: character_action
      canonical: The boy walks slowly while tracing the wall.
      proposed: The boy runs across while keeping a hand against the wall.
      rationale: Create a sharper visual interruption while preserving the motif.
      approval: approved_by_author
    - type: weather_and_time_emphasis
      canonical: The prose describes night sky, moon, yellow fog, and lost stars.
      proposed: The initial gameplay frame shows only threatening gray clouds above the wall.
      rationale: Create a claustrophobic first composition and prevent visual release.
      approval: approved_by_author
  production:
    environment_kit_ids:
    - KIT_COASTAL_INFRASTRUCTURE
    required_assets:
    - id: AST_DIKE_WALL_MODULE_SET
      display_name: Dike wall modular set
      classification: kit
      owner_tool: blender
      status: planned
    - id: AST_PAINTED_WAVES_DECAL
      display_name: Peeling painted-wave decal
      classification: unique
      owner_tool: mixed
      status: planned
    - id: AST_GRAY_DAMP_SAND
      display_name: Gray damp sand material
      classification: kit
      owner_tool: unreal
      status: planned
    - id: AST_GRAYSON_BASE_SPRITES
      display_name: Grayson idle and walk sprites
      classification: shared
      owner_tool: 2d_art
      status: planned
    - id: AST_BOY_RUN_SPRITE
      display_name: Boy running sprite
      classification: unique
      owner_tool: 2d_art
      status: planned
    - id: AST_DIKE_AMBIENCE
      display_name: Dike wave, wind, and city ambience
      classification: shared
      owner_tool: audio
      status: planned
    system_dependencies:
    - side-view locomotion
    - scene director
    - inspection interaction
    - scripted path event
    - subtitle/internal monologue presentation
    risks:
    - HD-2D readability must be proved in motion, not only in a still image.
    - Wall texture can become visually noisy behind sprites.
    - Boy must be noticeable without receiving explanatory UI.
- id: CH01_S02_DIKE_WALKWAY
  order: 2
  title: The Black Ocean
  location_id: LOC_OSAKA_DIKE_WALKWAY
  time_context: Night
  character_ids:
  - CHAR_GRAYSON_OCHS
  - CHAR_DIVER
  world_system_ids:
  - SYS_BASIC_INCOME_EXERCISE
  - SYS_SUICIDE_CREDITS
  - SYS_LIFE_BRACELET
  source_span:
    start_anchor: We walk the stairs that lead to the narrow path
    end_anchor: Noah says its time to go, so we go.
  canonical:
    events:
    - Grayson and Noah walk between the bright city and nearly invisible ocean.
    - They pass state incentive signs.
    - A registered diver jumps from the boardwalk and disappears into the ocean.
    - The narration explains Life Bracelets, suicide registration, and exercise-linked income.
    narrative_function:
    - Reveal the society’s economic control of bodies.
    - Contrast city brightness with oceanic darkness.
    - Show death as an administered transaction.
    entry_state: The pair arrive from the beach stairs.
    exit_state: They descend toward the city and the reading venue.
  adaptation:
    player_role: Walk alone and observe institutional systems.
    player_goal: Cross the dike while processing a distant death that the city treats as routine.
    camera: 'Side-on solitary path with split composition: city glow on one side and black ocean on the other.'
    gameplay_mode:
    - environmental storytelling
    - scripted distant event
    beats:
    - id: BEAT_STATE_SIGNS
      trigger: Player advances past signage.
      action: Reveal posters and optional inspect details.
      player_experience: The state’s incentives become increasingly disturbing.
      optional: false
    - id: BEAT_DIVER_EVENT
      trigger: Player approaches boardwalk sightline.
      action: A distant figure disappears beyond the railing; Life Bracelet terminal updates later.
      player_experience: The player witnesses consequence without intervention.
      optional: false
    - id: BEAT_LEAVE_DIKE
      trigger: Player reaches the descent after the diver sequence.
      action: Enable descent transition toward the city route.
      player_experience: Grayson leaves the dike alone and continues toward his obligation.
      optional: false
    interactions:
    - exercise poster
    - suicide registration sign or terminal
    - abortion-credit poster
    - boardwalk sightline
    audio_direction:
    - Waves grow louder near ocean-facing sections.
    - City electrical buzz competes with wind.
    - Avoid dramatic musical swell during the dive.
    visual_direction:
    - No visible horizon; ocean and sky merge.
    - Solar boardwalk forms a narrow yellow line into blackness.
    - State signage is clean and transactional against decayed infrastructure.
    transition_out: Descend alone to the urban route.
    changes_from_source:
    - type: companion_removal
      canonical: Grayson and Noah walk the dike together and leave after Noah says it is time to go.
      proposed: Grayson crosses the dike alone and decides to continue toward the reading without Noah.
      rationale: Delay Noah's adaptation introduction until Grayson reaches the reading venue.
      approval: approved_by_author
  production:
    environment_kit_ids:
    - KIT_COASTAL_INFRASTRUCTURE
    - KIT_STATE_SIGNAGE
    required_assets:
    - id: AST_DIKE_TOP_MODULES
      display_name: Dike walkway, stairs, railing, and boardwalk
      classification: kit
      owner_tool: blender
      status: planned
    - id: AST_STATE_POSTER_SET_A
      display_name: State incentive poster set
      classification: kit
      owner_tool: 2d_art
      status: planned
    - id: AST_DIVER_SILHOUETTE
      display_name: Distant diver animation
      classification: unique
      owner_tool: 2d_art
      status: planned
    - id: AST_LIFE_BRACELET_TERMINAL
      display_name: Life Bracelet registration terminal
      classification: shared
      owner_tool: mixed
      status: planned
    system_dependencies:
    - environmental inspection
    - distant scripted animation
    - content-setting support
    risks:
    - Sensitive subject requires careful framing and playtesting.
    - Too much explanatory text could halt the opening pace.
- id: CH01_S03_WALK_TO_VENUE
  order: 3
  title: Toward the Reading
  location_id: LOC_OSAKA_URBAN_ROUTE
  time_context: Night
  character_ids:
  - CHAR_GRAYSON_OCHS
  - CHAR_NOAH
  - CHAR_VENUE_HOST
  world_system_ids:
  - SYS_LIFE_BRACELET
  source_span:
    start_anchor: Are you okay?
    end_anchor: this way.
  canonical:
    events:
    - Grayson admits he is not okay.
    - Noah urges him not to disclose why he wrote the book.
    - They cross Rails and follow a solar sidewalk to an old venue.
    - A teenage host welcomes and directs Grayson backstage.
    narrative_function:
    - Establish the concealed personal reason behind the comedy book.
    - Use humor to show Grayson and Noah’s relationship.
    - Move from private dread to public obligation.
    entry_state: Grayson and Noah descend from the dike.
    exit_state: Grayson stands behind the stage curtain.
  adaptation:
    player_role: Guide Grayson alone through the city route; meet Noah upon reaching the reading venue.
    player_goal: Reach the venue despite Grayson’s reluctance.
    camera: Tracking side camera with bright city layers and brief crossing pauses.
    gameplay_mode:
    - solitary traversal
    - transition
    beats:
    - id: BEAT_SOLITARY_ROUTE
      trigger: Walk begins.
      action: Let Grayson cross the Rails and follow the solar sidewalk alone, with brief Lens or internal observations.
      player_experience: The isolation of the opening persists into the city.
      optional: false
    - id: BEAT_NOAH_AT_VENUE
      trigger: Player reaches the venue exterior or rear entrance.
      action: Introduce Noah for the first time in the adaptation, already waiting to support Grayson before the
        reading.
      player_experience: Companionship arrives only as Grayson reaches his public obligation.
      optional: false
    - id: BEAT_ENTER_VENUE
      trigger: Noah introduction completes.
      action: Venue host welcomes Grayson and directs him backstage.
      player_experience: Control narrows as the performance approaches.
      optional: false
    interactions:
    - Life Bracelet tracking light
    - Rail crossing signal
    - solar sidewalk
    - venue gargoyle
    audio_direction:
    - City noise overwhelms ocean sound.
    - Rail pass-bys punctuate the solitary route.
    - No companion conversation occurs before the venue.
    visual_direction:
    - Buzzing white electric city contrasts with the sleeping brown venue.
    - Gargoyle acts as a distinctive landmark.
    transition_out: Push through backstage curtain into the reading scene.
    changes_from_source:
    - type: character_entry_order
      canonical: Noah accompanies Grayson from the dike and talks with him throughout the route to the venue.
      proposed: Grayson travels alone; Noah first appears when Grayson arrives at the reading venue.
      rationale: Extend Grayson’s isolation and make Noah’s arrival a clear shift before the public performance.
      approval: approved_by_author
  production:
    environment_kit_ids:
    - KIT_URBAN_TRANSIT
    - KIT_OLD_COMMERCIAL_INTERIOR
    required_assets:
    - id: AST_SOLAR_SIDEWALK
      display_name: Solar sidewalk modules
      classification: kit
      owner_tool: unreal
      status: planned
    - id: AST_RAIL_CROSSING
      display_name: Rail crossing and passing Pods
      classification: kit
      owner_tool: mixed
      status: planned
    - id: AST_VENUE_EXTERIOR
      display_name: Venue exterior and gargoyle
      classification: unique
      owner_tool: blender
      status: planned
    system_dependencies:
    - pedestrian crossing trigger
    - character introduction event
    risks:
    - Dialogue density may compete with traversal.
- id: CH01_S04_BOOK_READING
  order: 4
  title: The Comedy Performance
  location_id: LOC_READING_VENUE
  time_context: Night
  character_ids:
  - CHAR_GRAYSON_OCHS
  - CHAR_NOAH
  - CHAR_VENUE_HOST
  - CHAR_WHISKEY_WOMAN
  world_system_ids:
  - SYS_LENS
  source_span:
    start_anchor: The curtain is dark
    end_anchor: leave the stage to applause.
  canonical:
    events:
    - Grayson imagines catastrophic audience reactions before entering.
    - He performs selections from his parenting satire.
    - Audience members ask questions, including the unnamed woman.
    - The audience laughs, but Grayson cannot feel the humor.
    narrative_function:
    - Externalize performance anxiety.
    - Introduce the gap between public comedy and private grief.
    - Introduce the woman before the bar encounter.
    entry_state: Grayson is behind the curtain.
    exit_state: Grayson leaves the stage after applause.
  adaptation:
    player_role: Perform as Grayson while controlling pacing, selected answers, or focus.
    player_goal: Complete the reading while noticing the audience’s mediated attention.
    camera: Fixed stage composition with audience depth and Lens-colored eye highlights.
    gameplay_mode:
    - performance dialogue
    - timed delivery
    - observation
    beats:
    - id: BEAT_CURTAIN_ANXIETY
      trigger: Before stage entry.
      action: Present rapidly shifting imagined outcomes using sound or brief visual overlays.
      player_experience: The player experiences Grayson’s dread.
      optional: false
    - id: BEAT_READING_START
      trigger: Player crosses curtain.
      action: Begin structured excerpts and audience response.
      player_experience: Public persona takes control.
      optional: false
    - id: BEAT_AUDIENCE_QUESTIONS
      trigger: Reading concludes.
      action: Offer response choices that preserve the same canonical exchange.
      player_experience: The player expresses Grayson’s defensive style.
      optional: false
    - id: BEAT_WOMAN_QUESTION
      trigger: Woman stands.
      action: Deliver bacteria-in-baby-food exchange and establish her silhouette.
      player_experience: The later bar recognition is prepared.
      optional: false
    interactions:
    - stage microphone
    - stool
    - audience Lens observations
    - optional glance toward empty exit
    audio_direction:
    - Dry microphone sound.
    - Laughter becomes increasingly detached from Grayson’s emotional state.
    - Backstage ambience leaks faintly.
    visual_direction:
    - Hard white stage light isolates Grayson against black curtain.
    - Audience mostly dark with moving Lens colors in eyes.
    transition_out: Applause transitions backstage.
    changes_from_source:
    - type: character_first_appearance
      canonical: Noah has accompanied Grayson since the beach.
      proposed: Noah is introduced at the reading venue immediately before or during Grayson’s arrival backstage.
      rationale: This is the approved first appearance of Noah in the game adaptation.
      approval: approved_by_author
  production:
    environment_kit_ids:
    - KIT_OLD_COMMERCIAL_INTERIOR
    required_assets:
    - id: AST_READING_STAGE
      display_name: Small stage, curtain, microphone, and stool
      classification: kit
