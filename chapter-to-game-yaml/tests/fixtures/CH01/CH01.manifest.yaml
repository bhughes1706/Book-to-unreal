    - cut fence
    - stairs
    - rooftop edge
    - voice-location cues
    audio_direction:
    - City noise fades floor by floor.
    - Wind, distant ocean, and structure creaks remain.
    - Use music sparingly or not at all at the final hold.
    visual_direction:
    - Repeated concrete floors form tooth-like vertical rhythm.
    - Fog hides detail and occasionally the woman.
    - Orange city glow below; near-black sky above.
    transition_out: Hold and fade to chapter completion.
