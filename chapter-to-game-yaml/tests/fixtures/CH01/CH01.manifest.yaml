    end_anchor: Exactly.” We lean against each other.
  canonical:
    events:
    - The woman leads Grayson through cut fencing into an unfinished tower.
    - They climb repeated concrete stairs above the city noise.
    - Fog obscures her as she calls from the darkness.
    - They stand over the orange city glow and lean together in rare silence.
