chapter:
  id: CH01
  number: 1
  title: null
  point_of_view: first-person, Grayson Ochs
  tense: primarily present tense
  canonical_summary: In a climate-damaged future Osaka, writer Grayson Ochs contemplates a painted seawall, witnesses
    a registered suicide, performs a satirical parenting-book reading, and meets an unnamed whiskey-drinking woman
    who challenges the lies behind his comedy before leading him above the city into rare silence.
  themes:
  - artificial substitutes for nature
  - commodification of life and death
  - surveillance traded for security
  - performance versus private grief
  - lies and self-deception
  - isolation and temporary escape
  adaptation_summary: A narrative-exploration chapter built from nine compact scene units, using environmental observation,
    controlled dialogue, transit interludes, and scripted character events rather than combat.
characters:
- id: CHAR_GRAYSON_OCHS
  display_name: Grayson Ochs
  chapter_role: protagonist and player character
  canonical:
    facts:
    - Writer who publicly presents his book as comedy.
    - Uses cynicism and jokes to deflect pain.
    - Carries unresolved grief connected to why he wrote the book.
    confidence: explicit
  adaptation_notes:
  - Primary controllable character.
  - Internal observations should remain concise and optional where possible.
  first_scene_id: CH01_S01_DIKE_BEACH
- id: CHAR_NOAH
  display_name: Noah
  chapter_role: Grayson’s friend and tour companion
  canonical:
    facts:
    - Physically imposing friend with dark skin and black eyes.
    - Encourages Grayson not to disclose why he wrote the book.
    - Uses drugs recreationally and supports Grayson during the reading tour.
    confidence: explicit
  adaptation_notes:
  - First appears in the adaptation when Grayson arrives at the reading venue.
  - Can function as contextual companion rather than exposition dispenser after his introduction.
  - His absence from the beach, dike, and route-to-venue scenes is an approved departure from the novel.
  first_scene_id: CH01_S04_BOOK_READING
- id: CHAR_MYSTERIOUS_BOY
  display_name: Unidentified boy
  chapter_role: unexplained visual omen
  canonical:
    facts:
    - Appears alone beside the dike at night.
    - Moves a hand up and down along the painted wall in rhythm with the unseen waves.
    - Hums and receives no explanation.
    confidence: explicit
  adaptation_notes:
  - Approved proposal changes his movement from walking to a sudden run while keeping one hand against the wall.
  first_scene_id: CH01_S01_DIKE_BEACH
- id: CHAR_DIVER
  display_name: Unidentified diver
  chapter_role: demonstrates the suicide-credit system
  canonical:
    facts:
    - Jumps from the boardwalk into the ocean after registering for suicide credits.
    confidence: explicit
  adaptation_notes:
  - Keep distant and non-sensational; communicate system through environment and aftermath.
  first_scene_id: CH01_S02_DIKE_WALKWAY
- id: CHAR_VENUE_HOST
  display_name: Venue host
  chapter_role: minor guide
  canonical:
    facts:
    - Teenager with acne who enthusiastically welcomes Grayson and directs him backstage.
    confidence: explicit
  adaptation_notes: []
  first_scene_id: CH01_S03_WALK_TO_VENUE
- id: CHAR_WHISKEY_WOMAN
  display_name: Unnamed whiskey-drinking woman
  chapter_role: mysterious challenger and catalyst
  canonical:
    facts:
    - Attends the reading and asks about bacteria in baby food.
    - Has striking dark “tornado” hair and blue eyes.
    - Rejects synthetic whiskey and challenges Grayson’s insistence that his book is only a joke.
    - Does not provide her name.
    confidence: explicit
  adaptation_notes:
  - Preserve recognizable silhouette and refusal to be categorized.
  first_scene_id: CH01_S04_BOOK_READING
