    - End the chapter with vertical escape, vulnerability, and temporary connection.
    - Contrast the city’s artificial brightness with darkness that feels alive.
    entry_state: They enter the construction site.
    exit_state: They remain together above the city in fog and silence.
  adaptation:
    player_role: Climb and follow a voice through fog.
    player_goal: Reach a place where silence and isolation feel restorative rather than empty.
    camera: Side-view ascent using repeated modular floors, then a wide rooftop composition with deep fog.
    gameplay_mode:
    - vertical traversal
    - audio navigation
    - cinematic observation
    beats:
    - id: BEAT_ENTER_CUT_FENCE
      trigger: Player locates breach.
      action: Pass into dark unfinished structure.
      player_experience: The city’s managed spaces are left behind.
      optional: false
    - id: BEAT_ASCENT
      trigger: Player climbs modular stair sequences.
      action: Reduce city volume and visible light with elevation.
      player_experience: Silence becomes a measurable reward.
      optional: false
    - id: BEAT_LOST_IN_FOG
      trigger: Fog threshold reached.
      action: Woman disappears; player follows spatial voice cues.
      player_experience: Vulnerability replaces playful certainty.
      optional: false
    - id: BEAT_CITY_REVEAL
      trigger: Player reaches rooftop edge.
      action: Reveal diffuse orange city below and blackness above.
      player_experience: The scale of the world returns without its noise.
      optional: false
    - id: BEAT_CHAPTER_END
      trigger: Final dialogue completes.
      action: Characters lean together; hold the frame before fade.
      player_experience: Connection and singularity coexist.
      optional: false
