story_changes:
  - id: CHANGE_NOAH_FIRST_APPEARANCE
    type: character_first_appearance
    canonical: >-
      Noah has accompanied Grayson since the beach and is waiting when the
      reading ends.
    proposed: >-
      Noah’s first game appearance occurs at the reading venue, immediately
      before or during the backstage transition.
    rationale: >-
      Preserve the author-approved solitary opening while placing Noah at the
      point where his support becomes dramatically active.
    approval: approved
staging:
  npcs:
    - id: ACTOR_WHISKEY_WOMAN
      display_name: Unnamed woman
      role: Distinctive audience member who challenges Grayson
      presence: present_at_start
      behavior: idle
      exit_beat_id: BEAT_APPLAUSE_TRANSITION
      staging_notes: >-
        Keep her tornado-like hair and asymmetrical stance readable in
        silhouette; do not name her.
      approval: unreviewed
    - id: ACTOR_AUDIENCE_QUESTIONER
      display_name: Audience questioner
      role: Japanese attendee whose question establishes Lens translation
      presence: present_at_start
      behavior: stationary
      exit_beat_id: BEAT_APPLAUSE_TRANSITION
      staging_notes: >-
        Rise from the audience after the reading montage and speak Japanese
        while the translated line is heard.
      approval: unreviewed
    - id: ACTOR_NOAH
      display_name: Noah
      role: Grayson’s companion and first backstage support
      presence: enters_on_beat
      behavior: scripted
      entrance_beat_id: BEAT_APPLAUSE_TRANSITION
      staging_notes: >-
        Appear at the backstage edge with water as applause carries through the
        curtain.
      approval: unreviewed
  interactables:
    - id: INTERACT_STAGE_MICROPHONE
      name: Stage microphone
      kind: prop
      interaction_prompt: Begin the reading
      outcome: Commit Grayson to the performance and start the reading montage.
      approval: unreviewed
    - id: INTERACT_AUDIENCE_LENSES
      name: Audience Lens glow
      kind: inspection
      interaction_prompt: Observe
      outcome: Notice moving Lens colors and the audience’s divided attention.
      approval: unreviewed
    - id: INTERACT_STAGE_STOOL
      name: Stage stool
      kind: prop
      interaction_prompt: Sit
      outcome: >-
        Change Grayson’s delivery pose without changing the reading’s outcome.
      approval: unreviewed
