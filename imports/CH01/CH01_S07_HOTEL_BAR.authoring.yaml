  - id: DIALOGUE_WOMAN_WHO_ARE_YOU
    speaker: Unnamed woman
    text: Who do I think I am? I’m just a girl who likes whiskey. Who are you?
    source_locked: true
    approval: unreviewed
    player_choice:
      id: CHOICE_GRAYSON_BAR_IDENTITY
      prompt: How does Grayson answer her?
      canonical_bounds: >-
        The woman still challenges his self-description, takes the bottle, and
        leads him into the street. The choice changes expressed vulnerability,
        not the scene outcome.
      approval: needs_discussion
      options:
        - id: OPTION_WRITER_DEFLECTION
          label: I’m just a writer.
          effect: >-
            Preserve the source answer and keep Grayson’s identity at a
            defensive distance.
          effect_scopes:
            - self_definition
            - relationship
        - id: OPTION_ADMIT_UNCERTAINTY
          label: I don’t know who I am.
          effect: >-
            Let Grayson briefly admit uncertainty before the woman pushes him
            toward surrendering control.
          effect_scopes:
            - relationship
            - scene_variation
  - id: DIALOGUE_WOMAN_LOSS_OF_CONTROL
    speaker: Unnamed woman
    text: See? You forgot how much fun it is not to be in control all the time.
    source_locked: true
    approval: unreviewed
  - id: DIALOGUE_WOMAN_LETS_GO
    speaker: Unnamed woman
    text: Let’s go.
    source_locked: true
    approval: unreviewed
story_changes:
  - id: CHANGE_BAR_IDENTITY_BRANCH
    type: dialogue_branch
    canonical: >-
      Grayson answers that he is just a writer, and the woman immediately
      challenges whether that is who he really is.
    proposed: >-
      Let the player preserve the writer deflection or briefly admit that
      Grayson no longer knows who he is.
    rationale: >-
      Give the player expressive control at the conversation’s central identity
      question without changing the decision to follow the woman.
    approval: needs_discussion
staging:
  npcs:
    - id: ACTOR_WHISKEY_WOMAN
      display_name: Unnamed woman
      role: Provocateur who challenges Grayson’s controlled persona
      presence: enters_on_beat
      behavior: scripted
      entrance_beat_id: BEAT_WOMAN_SITS
      exit_beat_id: BEAT_LEAVE_WITH_BOTTLE
      staging_notes: >-
        Use the purple/fire split light, tornado-like hair, and eyes without
        Lens color. Preserve her lack of a name.
      approval: unreviewed
    - id: ACTOR_BARTENDER
      display_name: Bartender
      role: Quiet facilitator of the escalating whiskey exchange
      presence: present_at_start
      behavior: stationary
      staging_notes: >-
        React minimally, using looks toward Grayson to ask for consent and
        payment.
      approval: unreviewed
    - id: ACTOR_LENS_PATRON
      display_name: Lens-absorbed patron
      role: Environmental contrast to the unnamed woman
      presence: present_at_start
      behavior: stationary
      staging_notes: >-
        Sit impossibly upright with projected colors moving across the irises.
      approval: unreviewed
  interactables:
    - id: INTERACT_SYNTH_COCKTAIL
      name: Synthetic lime cocktail
      kind: prop
      interaction_prompt: Take a drink
      outcome: Invite the unnamed woman’s criticism and begin the encounter.
      approval: unreviewed
    - id: INTERACT_REAL_WHISKEY_BOTTLE
      name: Real whiskey bottle
      kind: prop
      interaction_prompt: Pour real whiskey
      outcome: >-
        Replace synthetic safety with an uncontrolled, physically felt
        experience.
      approval: unreviewed
  items:
    - id: ITEM_LIFE_BRACELET
      name: Life Bracelet
      kind: personal_item
      initial_state: held
      persistence: chapter
      interaction_prompt: Pay
      outcome: >-
        Pay for the bottle and underline that real whiskey costs less than the
        synthetic cocktail.
      approval: unreviewed
  hud_events:
    - id: HUD_WOMAN_NO_LENS
      channel: internal_observation
      text: No colors dance inside her irises.
      trigger: Grayson studies the woman across the purple and orange light.
      dismiss_mode: player_dismiss
      duration_seconds: 0
      approval: unreviewed
    - id: HUD_BAR_CHOICE_CONSEQUENCE
      channel: choice_consequence
      text: She heard the part of the answer he usually keeps hidden.
      trigger: The player chooses how Grayson defines himself.
      dismiss_mode: beat_advance
      duration_seconds: 0
      approval: unreviewed
    - id: LENS_SYSTEM_NOTIFICATION_CONGRATULATE_DIVER_FAMILY
      channel: system_notification
      text: >-
        Registered diver status confirmed. Would you like to congratulate the
        beneficiary family?
      trigger: >-
        The Life Bracelet network confirms the pier diver’s registered death
        while Grayson is in the hotel bar.
      dismiss_mode: player_dismiss
      duration_seconds: 0
      responses:
        - id: GRAYSON_RESPONSE_CONGRATULATE_FAMILY
          label: Congratulate the family
          outcome: >-
            Send the state-authored condolence and congratulations message
            through the Lens.
          set_flag: FLAG_DIVER_FAMILY_CONGRATULATED
        - id: GRAYSON_RESPONSE_DISMISS_DIVER_NOTICE
          label: Dismiss
          outcome: Close the prompt without contacting the beneficiary family.
          set_flag: FLAG_DIVER_FAMILY_NOTICE_DISMISSED
      event_thread:
        id: EVENT_PIER_DIVER_FAMILY_PAYOUT
        role: callback
        note: >-
          The state converts the distant death Grayson witnessed into a polite
          social prompt.
      approval: needs_discussion
  beats:
    - id: BEAT_NOAH_DEPARTS
      title: Enter the purple bar
      trigger:
        type: begin_play
      optional: false
      actions:
        - id: ACTION_FRAME_PURPLE_BAR
          type: camera
          target_id: PURPLE_ORANGE_BAR_WIDE
          detail: >-
            Establish isolated patrons, the wall of fire, and Grayson’s empty
            neighboring seats.
      approval: unreviewed
    - id: SCENE_BEAT_DIVER_FAMILY_NOTIFICATION
      title: The state confirms the pier diver
      trigger:
        type: beat_completed
        target: BEAT_NOAH_DEPARTS
      optional: false
      actions:
        - id: ACTION_SHOW_DIVER_FAMILY_NOTIFICATION
          type: show_hud
          target_id: LENS_SYSTEM_NOTIFICATION_CONGRATULATE_DIVER_FAMILY
          detail: >-
            Interrupt the warm bar lighting with a polite state prompt that
            reduces the witnessed death to a social transaction.
      approval: needs_discussion
    - id: BEAT_WOMAN_SITS
      title: The woman takes the next seat
      trigger:
        type: interaction
        target: INTERACT_SYNTH_COCKTAIL
      optional: false
      actions:
        - id: ACTION_SPAWN_WHISKEY_WOMAN
          type: spawn_npc
          target_id: ACTOR_WHISKEY_WOMAN
          detail: Seat her beside Grayson despite the surrounding empty stools.
        - id: ACTION_PLAY_REAL_WHISKEY_ORDER
          type: play_dialogue
          target_id: DIALOGUE_WOMAN_REAL_WHISKEY
          detail: Interrupt the bartender before the synthetic bottle is poured.
        - id: ACTION_SHOW_NO_LENS_OBSERVATION
          type: show_hud
          target_id: HUD_WOMAN_NO_LENS
          detail: Show only once the woman’s eyes are readable in split light.
      approval: unreviewed
    - id: BEAT_REAL_WHISKEY
      title: Toast to hangovers
      trigger:
        type: dialogue_complete
        target: DIALOGUE_WOMAN_REAL_WHISKEY
      optional: false
      actions:
        - id: ACTION_REVEAL_REAL_WHISKEY
          type: update_interactable
          target_id: INTERACT_REAL_WHISKEY_BOTTLE
          detail: >-
            Bring out the dusty bottle and give the glass and liquid tactile
            weight.
        - id: ACTION_PLAY_HANGOVER_TOAST
          type: play_dialogue
          target_id: DIALOGUE_GRAYSON_TO_HANGOVERS
          detail: Let Grayson commit to the first real drink in years.
      approval: unreviewed
    - id: BEAT_LIES_DIALOGUE
      title: Talk about lies
      trigger:
        type: dialogue_complete
        target: DIALOGUE_GRAYSON_TO_HANGOVERS
      optional: false
      actions:
        - id: ACTION_PLAY_REFRESHING_LIE
          type: play_dialogue
          target_id: DIALOGUE_WOMAN_REFRESHING_LIE
          detail: >-
            Turn the conversation from the reading toward Grayson’s concealed
            motive.
        - id: ACTION_PLAY_ALL_LIES
          type: play_dialogue
          target_id: DIALOGUE_WOMAN_ALL_LIES
          detail: Push from public performance into identity.
        - id: ACTION_PLAY_IDENTITY_QUESTION
          type: play_dialogue
          target_id: DIALOGUE_WOMAN_WHO_ARE_YOU
          detail: Offer the bounded expressive choice after the source question.
        - id: ACTION_SHOW_BAR_CHOICE
          type: show_hud
          target_id: HUD_BAR_CHOICE_CONSEQUENCE
          detail: >-
            Only show when the non-canonical vulnerability option is selected.
      approval: needs_discussion
    - id: BEAT_LEAVE_WITH_BOTTLE
      title: Follow her outside
      trigger:
        type: dialogue_complete
        target: DIALOGUE_WOMAN_WHO_ARE_YOU
      optional: false
      actions:
        - id: ACTION_PLAY_LOSS_OF_CONTROL
          type: play_dialogue
          target_id: DIALOGUE_WOMAN_LOSS_OF_CONTROL
          detail: >-
            Land the scene’s bodily and thematic turn before she stands.
        - id: ACTION_GIVE_WHISKEY_BOTTLE
          type: update_interactable
          target_id: INTERACT_REAL_WHISKEY_BOTTLE
          detail: The woman takes the bottle for the walk.
        - id: ACTION_PLAY_LETS_GO
          type: play_dialogue
          target_id: DIALOGUE_WOMAN_LETS_GO
          detail: Have her move before Grayson has fully decided to follow.
        - id: ACTION_UNLOCK_NIGHT_WALK
          type: unlock_exit
          target_id: CH01_S08_NIGHT_WALK
          detail: Resolve Bracelet payment, then transition to the street.
      approval: unreviewed
notes: >-
  The unnamed woman must remain unnamed in Chapter 1. The alternative identity
  response is an explicit proposal and should not be treated as canon until
  reviewed.
