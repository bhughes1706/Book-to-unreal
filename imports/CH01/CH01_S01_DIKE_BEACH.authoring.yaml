  - id: DIALOGUE_NOAH_WALK_UP
    speaker: Noah
    text: Want to walk up there?
    source_locked: true
    approval: approved
story_changes:
  - id: CHANGE_NOAH_ENTRY_ORDER
    type: character_entry_order
    canonical: Noah is present on the beach before the boy appears and climbs the dike with Grayson.
    proposed: Grayson begins alone. Noah first appears when Grayson reaches the reading venue.
    rationale: Preserve the opening isolation and make companionship a clear emotional shift.
    approval: approved
